<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .animate-pulse-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid theme('colors.primary');
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile antialiased">
<!-- Main Content Canvas (Transactional Screen - No Shell Navigation) -->
<main class="w-full max-w-sm mx-auto">
<!-- Status Card -->
<div class="bg-surface-container-lowest rounded-[32px] p-8 flex flex-col items-center text-center shadow-[0_8px_30px_rgba(21,66,18,0.08)] relative overflow-hidden">
<!-- Subtle Background Glow -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-secondary-container rounded-full blur-3xl opacity-50"></div>
<!-- Brand Logo Area -->
<div class="w-20 h-20 mb-8 rounded-full bg-surface flex items-center justify-center shadow-sm border border-surface-container-highest z-10">
<img class="w-12 h-12 object-contain rounded-full" data-alt="A clean, minimalist vector graphic representation of a mobile money service logo, featuring a vibrant green hue and curved organic shapes, isolated on a stark white background. The style is modern, trustworthy, and heavily references Kenyan mobile payment aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0va4y0n--ONTClwLg34kJrRtFlWyzPIDmxhsh3cPYPpjVwl-Oco_Kx2hVAOQJTrenrFYZtoTOwwbiu8v6OurNyacM4n2MQnsrYOnyj-CIJ-nLd4zpw9Z2kyRdXD72QvD0xX3TY32v1t7LDi8A7XaAZulTRlSaDBAAYi4rDuUHGWvWw4wYy6YFqaH56hHYJKTF4jDhDi_m0cBnarTnyZKWjDKtZ3utSgfiwzm0Dva2qggm-Aw9DMtc"/>
</div>
<!-- Loading Indicator & Icon -->
<div class="relative flex items-center justify-center w-16 h-16 mb-6 z-10 animate-pulse-ring">
<!-- Static Background Track -->
<div class="absolute inset-0 rounded-full border-4 border-surface-variant"></div>
<!-- Spinning Progress Track -->
<div class="absolute inset-0 rounded-full border-4 border-primary border-t-transparent animate-spin"></div>
<!-- Center Icon -->
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    phonelink_ring
                </span>
</div>
<!-- Status Messaging -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-3 z-10">
                Processing Payment
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 px-2 z-10">
                Please check your phone. We've sent an STK Push for you to enter your M-Pesa PIN.
            </p>
<!-- Transaction Details Box -->
<div class="w-full bg-surface-container rounded-[24px] p-6 flex flex-col gap-4 z-10 shadow-inner">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Amount</span>
<span class="font-price-display text-price-display text-primary">KSh 1,470</span>
</div>
<hr class="border-outline-variant/30"/>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-on-surface-variant">Order ID</span>
<span class="font-body-lg text-body-lg font-semibold text-on-surface">#4892</span>
</div>
</div>
<!-- Cancel Action -->
<button class="mt-8 font-label-caps text-label-caps text-outline hover:text-error transition-colors flex items-center gap-2 group z-10">
<span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform">close</span>
                CANCEL PAYMENT
            </button>
</div>
</main>
<!-- Simulating Auto-Redirect after processing for interactive feel (Visual only) -->
<script>
        setTimeout(() => {
            const h1 = document.querySelector('h1');
            const p = document.querySelector('p');
            const spinner = document.querySelector('.animate-spin');
            const icon = document.querySelector('.material-symbols-outlined.text-3xl');
            const pulse = document.querySelector('.animate-pulse-ring');
            
            if(h1 && p && spinner && icon && pulse) {
                h1.textContent = "Payment Successful";
                p.textContent = "Your order is now being prepared for farm-fresh delivery.";
                spinner.style.display = 'none';
                pulse.classList.remove('animate-pulse-ring');
                icon.textContent = "check_circle";
                icon.classList.add('text-secondary');
            }
        }, 8000); // Simulate an 8-second wait
    </script>
</body></html>
