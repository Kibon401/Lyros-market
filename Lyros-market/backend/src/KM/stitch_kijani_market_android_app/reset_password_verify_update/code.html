<script>
        // 6-digit code input logic
        const codeInputs = document.querySelectorAll('.code-input-group input');
        
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '' && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/\D/g, '');
                pastedData.split('').forEach((char, i) => {
                    if(codeInputs[i]) {
                        codeInputs[i].value = char;
                        if(i < codeInputs.length -1) codeInputs[i+1].focus();
                        else codeInputs[i].blur();
                    }
                });
            });
        });

        // Toggle Password Visibility
        const toggleButtons = document.querySelectorAll('.toggle-password');
        toggleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const icon = btn.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                }
            });
        });

        // Form Submit Prevent Default for Demo
        document.getElementById('reset-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // In a real app, handle validation and submission here
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="refresh">refresh</span> Updating...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Success';
                btn.classList.replace('bg-primary', 'bg-surface-tint');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-80');
                    btn.classList.replace('bg-surface-tint', 'bg-primary');
                }, 2000);
            }, 1500);
        });
    </script>
