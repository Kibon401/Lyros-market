<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .shadow-ambient {
            box-shadow: 0 4px 20px 0 rgba(21, 66, 18, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-sm min-h-screen flex selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Asymmetric Split Layout for Desktop -->
<!-- Left Canvas: Curated Imagery (Hidden on mobile) -->
<div class="hidden lg:block lg:w-1/2 relative bg-surface-container-low overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A highly detailed, editorial-style lifestyle photograph of fresh, organic vegetables and artisanal goods arranged elegantly on a rustic wooden table. The scene is bathed in warm, sun-drenched natural lighting, creating deep, soft shadows. The color palette emphasizes vibrant sage greens, deep forest greens, and earthy terracotta accents against a pristine, warm cream background. The aesthetic is clean, premium, and evocative of a high-end, community-focused farmers market." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBFptDlQOmW6TT2V-KRojw4OyA-PiCWknEc3lxsu6ees4lZcU61O2V14wLTFG4gGovc0AX_ATp5XJNjuCiaSfvUAIa4-wxgis54BH4NYfRR4LuHUT_ZX4oZfxXCMChjBWqPUPQb_oqER1LI4cipISQZqAX-pBz5o_I3C3BVDkNSV67n1cw-mbJd2XvQjF3zEmHmwllbPIS9fP800IQ8gl58UGAUgNnyeZPgPBrgmsD6tAxeUBAdQknj')"></div>
<!-- Gradient Overlay for subtle blending -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent to-background w-full h-full opacity-30"></div>
<!-- Brand Mark Overlay -->
<div class="absolute top-margin-desktop left-margin-desktop flex items-center gap-stack-sm bg-background/80 backdrop-blur-md px-6 py-3 rounded-full shadow-ambient">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">local_florist</span>
<span class="font-headline-md text-headline-md text-primary">Lyros</span>
</div>
</div>
<!-- Right Canvas: Functional Transaction Area -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Mobile Background Blob for visual interest -->
<div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-50 lg:hidden pointer-events-none"></div>
<div class="w-full max-w-[400px] flex flex-col gap-stack-lg z-10">
<!-- Header Section -->
<div class="flex flex-col gap-stack-sm text-center lg:text-left mb-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary font-bold tracking-tight">
                    Welcome back
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Enter your details to access your fresh finds.
                </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-2 uppercase tracking-wider" for="email">
                        Email Address
                    </label>
<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">mail</span>
</span>
<input class="w-full bg-surface-container-low border-2 border-transparent text-on-surface font-body-lg text-body-lg rounded-2xl py-4 pl-12 pr-4 focus:outline-none focus:border-secondary-container focus:bg-background transition-all duration-300 placeholder:text-outline-variant" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-base">
<div class="flex items-center justify-between ml-2 mr-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">
                            Password
                        </label>
<a class="font-body-sm text-body-sm text-primary hover:text-surface-tint hover:underline transition-colors focus:outline-none" href="#">
                            Forgot password?
                        </a>
</div>
<div class="relative group">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="w-full bg-surface-container-low border-2 border-transparent text-on-surface font-body-lg text-body-lg rounded-2xl py-4 pl-12 pr-12 focus:outline-none focus:border-secondary-container focus:bg-background transition-all duration-300 placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-4 text-outline-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="mt-4 w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-full shadow-ambient hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-4 focus:ring-secondary-container" type="submit">
                    Login to Account
                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-px bg-surface-dim flex-1"></div>
<span class="font-body-sm text-body-sm text-outline">or continue with</span>
<div class="h-px bg-surface-dim flex-1"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-surface border border-surface-dim text-on-surface font-headline-md text-headline-md py-4 rounded-full hover:bg-surface-container-low hover:border-outline-variant active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-3 focus:outline-none focus:ring-4 focus:ring-surface-container-highest" type="button">
<!-- Inline SVG for Google 'G' icon for cleaner UI without relying on external image requests -->
<svg class="w-6 h-6" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" fill="#EA4335"></path>
<path d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" fill="#4285F4"></path>
<path d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" fill="#FBBC05"></path>
<path d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" fill="#34A853"></path>
<path d="M0 0h48v48H0z" fill="none"></path>
</svg>
                Google
            </button>
<!-- Sign Up CTA -->
<div class="text-center mt-4">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-headline-md text-headline-md text-primary hover:text-surface-tint hover:underline transition-colors focus:outline-none ml-1" href="#">
                        Sign up
                    </a>
</p>
</div>
</div>
</div>
</body></html>
